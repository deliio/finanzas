  <meta name="mobile-web-app-capable" content="yes">

<body>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="#/inicio" data-route="inicio" class="tab">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Autorreparación: si la app no arranca (p. ej. copia offline con archivos de
       versiones distintas), ofrece borrar la caché y recargar. Los datos no se tocan. -->
  <div id="rescue" class="rescue" hidden>
    <p><strong>La app no ha podido cargar.</strong><br>Suele arreglarse borrando la copia guardada. Tus datos no se borran.</p>
    <button type="button" id="rescue-btn">Reparar y recargar</button>
  </div>
  <script>
    (function () {
      var shown = false;
      function rescue() {
        if (shown || document.querySelector('#view > *')) return;
        shown = true;
        document.getElementById('rescue').hidden = false;
      }
      // Solo los fallos de scripts pueden impedir que la app arranque; un CSS, una imagen
      // o un trozo de mapa que no cargue no es motivo para ofrecer la reparación.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && t.tagName && t.tagName !== 'SCRIPT') return;
        setTimeout(rescue, 2500);
      }, true);
      setTimeout(rescue, 6000);
      // La app llama a esto cuando ha pintado la primera pantalla.
      window.__appStarted = function () { shown = true; document.getElementById('rescue').hidden = true; };
      document.getElementById('rescue-btn').addEventListener('click', function () {
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        }
        Promise.all(jobs).finally(function () { location.replace(location.pathname + '?r=' + Date.now()); });
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
