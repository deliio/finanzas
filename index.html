<body>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Autorreparación: si la app no arranca (p. ej. copia offline con archivos de
       versiones distintas), ofrece borrar la caché y recargar. Los datos no se tocan. -->
  <div id="rescue" class="rescue" hidden>
    <p><strong>La app no ha podido cargar.</strong><br>Suele arreglarse borrando la copia guardada. Tus datos no se borran.</p>
    <button type="button" id="rescue-btn">Reparar y recargar</button>
  </div>
  <script>
    (function () {
      var shown = false;
      function rescue() {
        if (shown || document.querySelector('#view > *')) return;
        shown = true;
        document.getElementById('rescue').hidden = false;
      }
      window.addEventListener('error', function () { setTimeout(rescue, 300); }, true);
      setTimeout(rescue, 4000);
      document.getElementById('rescue-btn').addEventListener('click', function () {
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        }
        Promise.all(jobs).finally(function () { location.replace(location.pathname + '?r=' + Date.now()); });
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
